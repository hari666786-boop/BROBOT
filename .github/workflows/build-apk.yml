name: Build BROBOT debug APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project files from BROBOT_ALL_FILES.md
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          python3 - <<'PY'
          import re, os
          t = open('BROBOT_ALL_FILES.md', encoding='utf-8').read()
          n = 0
          for m in re.finditer(r'## 📁 `([^`]+)`\s*\n+```[a-z]*\n(.*?)\n```', t, re.S):
              p, c = m.group(1), m.group(2)
              if not (p.startswith('app/') or p in ('build.gradle.kts', 'settings.gradle.kts', 'gradle.properties')):
                  continue
              if p.endswith('ConstellationGraph.kt'):
                  c = c.replace('import androidx.compose.runtime.Composable\n', 'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.getValue\n', 1)
              os.makedirs(os.path.dirname(p) or '.', exist_ok=True)
              open(p, 'w', encoding='utf-8').write(c + '\n')
              n += 1
          print('files written:', n)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          code=$?
          grep -E "^e: |What went wrong" -A3 build.log | head -60
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: brobot-debug-apk
          path: app/build/outputs/apk/debug/*.apk